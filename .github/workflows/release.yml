name: Release

# Release / publish pipeline. Triggered ONLY by pushing a version tag (v*).
#
#   verify-version ─> artifact-layouts (build ─┬─> test-wheel) ─> publish
#                                              └─> test-sdist
#
# artifact-layouts is a workflow_call into .github/workflows/artifact-layouts.yml,
# which ci.yml calls too. Those three jobs used to be written out here. They were
# moved, unchanged apart from the two additions noted below, for one reason: as
# long as they lived only in this file they ran only on a tag push, which is the
# irreversible step. Every layout check therefore ran after the point of no
# return, and 0.3.0 is the proof — it is on PyPI permanently with its own shipped
# suite failing at the tarball root, and all eight artifact jobs of the release
# that shipped it were green. Calling the same body from ci.yml puts those checks
# in front of the tag. Pasting a second copy into ci.yml would have put them in
# front of the tag too, and then let the two copies drift, which is how "the
# thing we checked" stops being "the thing we shipped".
#
# The two additions, both in artifact-layouts.yml:
#   - test-sdist now also runs the shipped suite from the TARBALL ROOT, the
#     layout README.md:271 documents and the one the constructed test directory
#     structurally cannot reach.
#   - the version the installed sdist must report is now an input rather than
#     GITHUB_REF_NAME, because ci.yml has no tag. This workflow still passes the
#     tag, so nothing about the release-time assertion is weakened.
#
# test-wheel and test-sdist answer different questions and neither can answer
# the other's:
#   test-wheel  "does the installed wheel work on every supported Python?"
#   test-sdist  "is the source distribution complete?" -- which test-wheel
#               structurally CANNOT answer, because it sources tests/ from the
#               git checkout, so a tarball shipping no tests at all would still
#               go green.
#
# Working principle: a gate must consume the artifact it certifies. A gate that
# cannot fail is worse than no gate, because it converts an unknown into a false
# assurance. That is exactly what happened here: setuptools' legacy sdist default
# matches only tests/test*.py, so every sdist through 0.2.1 shipped without
# tests/conftest.py or tests/__init__.py. Installing the published 0.2.1 sdist
# and running its own suite gives 58 passed / 38 errors. Every gate was green,
# because no gate ever installed the sdist.
#
# Publishing is OIDC Trusted Publisher only (no API token), and ONLY the publish
# job is granted id-token: write.

on:
  push:
    tags:
      - 'v*'

# Default least privilege for every job. The publish job overrides this to add
# the single elevated scope it needs (id-token: write); no other job is elevated.
permissions:
  contents: read

jobs:
  # 1. Drift guard: the version in pyproject.toml at the tagged commit MUST equal
  #    the tag (minus the leading 'v'). Parsed with tomllib, never sed/grep.
  verify-version:
    name: Verify pyproject version matches tag
    runs-on: ubuntu-latest
    outputs:
      # The tag version, emitted only after it has been proven equal to
      # pyproject's. artifact-layouts consumes this to assert what the installed
      # sdist reports, so that assertion is still anchored on the tag.
      version: ${{ steps.compare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compare tag to pyproject version
        id: compare
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#v}"
          PYPROJECT_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=${TAG}  tag_version=${TAG_VERSION}  pyproject_version=${PYPROJECT_VERSION}"
          if [ "${TAG_VERSION}" != "${PYPROJECT_VERSION}" ]; then
            echo "::error::Tag version '${TAG_VERSION}' does not match pyproject version '${PYPROJECT_VERSION}'"
            exit 1
          fi
          echo "Version guard OK: ${TAG_VERSION} == ${PYPROJECT_VERSION}"
          echo "version=${TAG_VERSION}" >> "${GITHUB_OUTPUT}"

  # 2-4. Build the wheel and sdist, then test both installed artifacts, plus the
  #      shipped suite at the tarball root. Identical body to the one ci.yml runs
  #      on every pull request — same file, not a copy.
  artifact-layouts:
    name: Artifact layouts
    needs: [verify-version]
    uses: ./.github/workflows/artifact-layouts.yml
    with:
      expected-version: ${{ needs.verify-version.outputs.version }}

  # 5. Publish to PyPI via OIDC Trusted Publisher. Needs every gate green.
  #    This is the ONLY job with id-token: write, and it uses no API token.
  #    `needs: artifact-layouts` covers build, test-wheel and test-sdist: a
  #    called workflow's job fails if any job inside it fails, so publish is
  #    blocked by any one of them exactly as it was when they were listed here
  #    individually. The `dist` artifact is uploaded inside the called workflow
  #    and downloaded here — a reusable workflow shares the caller's run, so it
  #    is the same artifact store.
  publish:
    name: Publish to PyPI (Trusted Publisher / OIDC)
    needs: [verify-version, artifact-layouts]
    runs-on: ubuntu-latest
    environment: pypi
    # Overrides the top-level read-only default: the single elevated scope, here only.
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
